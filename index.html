<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truproof — Testimonial to Marketing Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-5xl mx-auto px-6 py-12">
    <!-- Header -->
    <header class="mb-10 text-center">
      <div class="inline-block px-3 py-1 bg-indigo-500/10 text-indigo-400 text-xs font-semibold rounded-full mb-3 border border-indigo-500/20">
        AI Marketing Engine MVP
      </div>
      <h1 class="text-4xl font-extrabold tracking-tight">Truproof</h1>
      <p class="text-slate-400 mt-2">Turn raw client testimonials into ready-to-publish case studies and social assets.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Input Card -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
        <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span> Input Testimonial
        </h2>
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Client Name</label>
            <input id="clientName" type="text" placeholder="e.g. Sarah Jenkins" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Company / Brand</label>
            <input id="company" type="text" placeholder="e.g. Nexus Tech" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Raw Review / Feedback</label>
            <textarea id="review" rows="4" placeholder="Paste the raw testimonial text here..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 outline-none"></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Asset to Generate</label>
            <select id="assetType" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 outline-none">
              <option value="case_study">Full B2B Case Study</option>
              <option value="linkedin">Viral LinkedIn Post</option>
              <option value="twitter">3-Tweet Proof Thread</option>
            </select>
          </div>
          <button onclick="generateAsset()" id="btnGenerate" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-md">
            Generate Asset
          </button>
        </div>
      </div>

      <!-- Output Card -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-bold flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Generated Output
            </h2>
            <button onclick="copyOutput()" id="btnCopy" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Copy Text</button>
          </div>
          <div id="outputArea" class="bg-slate-950 border border-slate-800 rounded-lg p-4 text-sm text-slate-300 min-h-[300px] whitespace-pre-wrap">Ready output will appear here after generation...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function generateAsset() {
      const clientName = document.getElementById('clientName').value.trim();
      const company = document.getElementById('company').value.trim();
      const review = document.getElementById('review').value.trim();
      const assetType = document.getElementById('assetType').value;
      const output = document.getElementById('outputArea');
      const btn = document.getElementById('btnGenerate');

      if (!review) return alert('Please enter a review text.');

      btn.innerText = 'Generating with AI...';
      btn.disabled = true;
      output.innerText = 'Generating content via Gemini engine...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientName, company, review, assetType })
        });
        const data = await res.json();
        output.innerText = data.output || data.error || 'No output generated.';
      } catch (err) {
        output.innerText = 'Error: ' + err.message;
      } finally {
        btn.innerText = 'Generate Asset';
        btn.disabled = false;
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputArea').innerText;
      navigator.clipboard.writeText(text);
      const btnCopy = document.getElementById('btnCopy');
      btnCopy.innerText = 'Copied!';
      setTimeout(() => btnCopy.innerText = 'Copy Text', 2000);
    }
  </script>
</body>
</html>
